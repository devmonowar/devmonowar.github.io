<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Bar chart comparing slider weight: slide images around 2 megabytes dwarf jQuery at 30 kilobytes and slider libraries at 12 to 40 kilobytes">
  <rect width="1200" height="630" fill="#f7f5f0"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">Where slider weight really comes from</text>
  <text x="60" y="104" font-family="Georgia, serif" font-size="20" fill="#666">rough proportions, not a measurement of any one site</text>
  <g font-family="Georgia, serif" font-size="22" fill="#1a1a1a">
    <text x="60" y="180">Slide images (3 × ~700 KB)</text>
    <rect x="60" y="195" width="1020" height="44" rx="6" fill="#b3402a"/>
    <text x="60" y="285" fill="#666" font-size="20">~2 MB</text>
    <text x="60" y="340">jQuery</text>
    <rect x="60" y="355" width="34" height="44" rx="6" fill="#2a6db3"/>
    <text x="110" y="385" fill="#666" font-size="20">~30 KB gzipped</text>
    <text x="60" y="440">Slick (needs jQuery above)</text>
    <rect x="60" y="455" width="20" height="44" rx="6" fill="#2a6db3"/>
    <text x="96" y="485" fill="#666" font-size="20">~15 KB gzipped</text>
    <text x="60" y="540">Splide (no jQuery)</text>
    <rect x="60" y="555" width="16" height="44" rx="6" fill="#3d8b4f"/>
    <text x="92" y="585" fill="#666" font-size="20">~12 KB gzipped</text>
  </g>
</svg>
